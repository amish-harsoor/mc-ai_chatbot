[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-ai-chatbot"
version = "0.1.0"
description = "Management Concepts RAG course chatbot — mountable FastAPI service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-index>=0.10.0,<0.13",
    "fastapi>=0.110,<0.116",
    "python-multipart>=0.0.9",
    "pydantic>=2.6,<3",
    "uvicorn[standard]>=0.29,<0.31",
    "python-dotenv>=1.0,<2",
    "psycopg2-binary>=2.9,<3",
    "openai>=1.30,<2",
    "groq>=0.9,<1",
    "fastembed>=0.3,<0.7",
    "llama-index-embeddings-fastembed>=0.2,<0.4",
    "transformers>=4.40,<5",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.31,<3",
    "python-frontmatter>=1.1,<2",
    "llama-index-retrievers-bm25>=0.5,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
client = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]